<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedBlack Music</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #111111;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #ff0000;
        }
        .header h1 {
            color: #ff0000;
            margin: 0;
            font-size: 20px;
        }
        .search-bar {
            padding: 10px;
            display: flex;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #222;
            color: #fff;
        }
        .search-bar button {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            background-color: #111;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
            border-top: 1px solid #222;
        }
        .tab {
            color: #888;
            text-decoration: none;
            font-size: 12px;
            text-align: center;
        }
        .tab.active {
            color: #ff0000;
            font-weight: bold;
        }
        .content {
            padding: 15px;
            padding-bottom: 70px;
        }
        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 10px;
            border-bottom: 1px solid #222;
        }
        .track-info {
            flex: 1;
            padding-right: 10px;
        }
        .track-info h4 { margin: 0; color: #fff; font-size: 15px; }
        .track-info p { margin: 5px 0 0 0; color: #888; font-size: 12px; }
        .play-btn {
            color: #ff0000;
            font-size: 22px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>RedBlack Music</h1>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Введите трек или автора...">
        <button onclick="searchMusic()">Поиск</button>
    </div>

    <div class="content">
        <h3>Главная</h3>
        <p style="color: #888;">Введите поисковый запрос выше, чтобы найти музыку.</p>
    </div>

    <div class="tabs">
        <a href="#" class="tab active"><div>🏠</div>Глава</a>
        <a href="#" class="tab"><div>🎵</div>Моя музыка</a>
        <a href="#" class="tab"><div>📥</div>Скачанное</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentAudio = null;

        function searchMusic() {
            let query = document.getElementById('searchInput').value;
            if(!query) return;
            
            let contentDiv = document.querySelector('.content');
            contentDiv.innerHTML = '<h3>Ищем в архиве... Подождите...</h3>';

            // Ищем mp3 файлы в открытом глобальном Архиве Интернета
            let url = `https://archive.org{encodeURIComponent(query)}+AND+mediatype:audio&fl[]=identifier,title,creator&output=json&rows=10`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    contentDiv.innerHTML = `<h3>Результаты: ${query}</h3>`;
                    let docs = data.response.docs;
                    if (!docs || docs.length === 0) {
                        contentDiv.innerHTML += '<p style="color: #888;">Ничего не найдено. Попробуйте другой запрос.</p>';
                        return;
                    }
                    docs.forEach((track, index) => {
                        let trackId = 'track_' + index;
                        // Генерируем прямую публичную ссылку на аудиопоток
                        let streamUrl = `https://archive.org{track.identifier}`;
                        let title = track.title || "Музыкальный трек";
                        let author = track.creator || "Неизвестный исполнитель";
                        
                        contentDiv.innerHTML += `
                            <div class="track-item">
                                <div class="track-info">
                                    <h4>${title}</h4>
                                    <p>${author}</p>
                                </div>
                                <button class="play-btn" id="btn_${trackId}" onclick="togglePlay('${trackId}', '${streamUrl}')">▶</button>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    contentDiv.innerHTML = '<h3>Ошибка глобального поиска</h3>';
                    console.error(err);
                });
        }

        function togglePlay(id, baseUrl) {
            let btn = document.getElementById('btn_' + id);
            
            // Для Архива Интернета нам нужно запустить первый попавшийся mp3 из раздачи
            // Чтобы не усложнять, если трек уже выбран, управляем паузой
            if (currentAudio && currentAudio.src.startsWith(baseUrl)) {
                if (currentAudio.paused) {
                    currentAudio.play().catch(e => alert("Не удалось включить поток: " + e));
                    btn.innerText = '⏸';
                } else {
                    currentAudio.pause();
                    btn.innerText = '▶';
                }
            } else {
                if (currentAudio) {
                    currentAudio.pause();
                    document.querySelectorAll('.play-btn').forEach(b => b.innerText = '▶');
                }
                
                // Пробуем запустить поток напрямую через архивный плеер
                contentDiv = document.querySelector('.content');
                let trackWindow = window.open(`${baseUrl}`, '_blank');
                btn.innerText = '🔊';
                alert("Открываем плеер архива с треком!");
            }
        }
    </script>
</body>
</html>
